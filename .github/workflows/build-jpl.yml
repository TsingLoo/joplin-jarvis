name: Build JPL

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Build plugin
        run: npm run dist

      - name: Upload JPL package
        uses: actions/upload-artifact@v7
        with:
          name: joplin.plugin.tsingloo.jarvis.jpl
          path: publish/joplin.plugin.tsingloo.jarvis.jpl
          archive: false
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" publish/joplin.plugin.tsingloo.jarvis.jpl --title "$GITHUB_REF_NAME" --generate-notes
